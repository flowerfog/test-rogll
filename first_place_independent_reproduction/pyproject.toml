[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "first-place-independent-reproduction"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "torch>=2.2",
  "timm>=1.0",
  "safetensors>=0.4",
]

[tool.setuptools.packages.find]
include = ["first_place_repro*"]
